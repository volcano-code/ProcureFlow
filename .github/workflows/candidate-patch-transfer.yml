name: candidate-patch-transfer
on:
  push:
    branches: ['develop/remediation-candidate-worker']
    paths: ['.github/workflows/candidate-patch-transfer.yml']
permissions:
  contents: read
jobs:
  prepare-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Apply exact reviewed patch and create unattached Git tree only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          repo='volcano-code/ProcureFlow'
          expected_tree='db2e266ccab18b25980924db4c241de58a2677c4'
          url='https://7a1dbdde-05a7-4e38-bda3-96b84a91c526.sandbox.floot.app/_cdn/static/582e275c-f999-4f37-b080-d188f685d36b-procureflow-candidate-worker-118b8ea.patch'
          with urllib.request.urlopen(url,timeout=30) as response:
              raw=response.read(1000001)
          assert len(raw)==76469
          assert hashlib.sha256(raw).hexdigest()=='118b8ea09008a7e2e2fa3ec29e031fdb33215ca814abe98fe7aecf5936b15545'
          subprocess.run(['git','apply','--check','-'],input=raw,check=True)
          subprocess.run(['git','apply','--index','-'],input=raw,check=True)
          subprocess.run(['git','rm','.github/workflows/candidate-worker-bootstrap.yml','.github/workflows/candidate-patch-transfer.yml'],check=True)
          local_tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert local_tree==expected_tree, 'SOURCE_TREE_MISMATCH'
          changed=subprocess.check_output(['git','diff','--cached','--name-status','--no-renames','-z']).decode().split('\0')
          entries=[]
          def post(endpoint, body):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/'+endpoint,
                  data=json.dumps(body).encode(),method='POST',headers={
                      'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                      'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)
          for i in range(0,len(changed)-1,2):
              status,path=changed[i:i+2]
              assert status in ('A','M','D')
              if status=='D':
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
              else:
                  data=pathlib.Path(path).read_bytes()
                  blob=post('blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
                  expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                  assert blob['sha']==expected
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          remote=post('trees',{'base_tree':base,'tree':entries})
          assert remote['sha']==expected_tree
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate-transfer'
          output.mkdir()
          (output/'tree.json').write_text(json.dumps({'tree':remote['sha'],'parent':os.environ['GITHUB_SHA'],
              'patch_sha256':hashlib.sha256(raw).hexdigest(),'branch_updated':False,
              'scope':'source transfer only; not test acceptance'},indent=2))
          print('Verified unattached tree:',remote['sha'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-transfer-tree
          path: ${{ runner.temp }}/candidate-transfer
          if-no-files-found: error
          retention-days: 7
