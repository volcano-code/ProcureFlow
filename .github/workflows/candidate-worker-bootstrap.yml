name: candidate-worker-bootstrap
on:
  push:
    branches: ['develop/remediation-candidate-worker']
    paths: ['.github/workflows/candidate-worker-bootstrap.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Download pinned requirements as wheels only
        run: |
          mkdir -p "$RUNNER_TEMP/pf-wheels"
          python -m pip download --only-binary=:all: -r services/api/requirements-dev.txt -r services/api/requirements-postgres.txt -d "$RUNNER_TEMP/pf-wheels"
          cd "$RUNNER_TEMP/pf-wheels"
          sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-worker-pinned-wheels
          path: ${{ runner.temp }}/pf-wheels
          if-no-files-found: error
          retention-days: 2
