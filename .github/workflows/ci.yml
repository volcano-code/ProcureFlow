name: core-and-native-ui-validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core-and-static-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r services/api/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test.py -q --junitxml=../../evals/reports/ci/pytest.xml
        env:
          PF_REQUIRE_BROWSER: '1'
          PF_CRASH_REPORT_DIR: ${{ github.workspace }}/evals/reports/ci/crash
          PF_SCREENSHOT_DIR: ${{ github.workspace }}/evals/reports/ci/static-browser
      - run: node --test apps/web/tests/transport.test.mjs
      - run: python scripts/web_http_smoke.py --output evals/reports/ci/frontend-http.json
      - run: python scripts/smoke.py --output evals/reports/ci/http-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-validation-records
          path: evals/reports/ci
  native-next-browser:
    # This is a pending strict gate, NOT evidence of a remotely executed green CI.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r services/api/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      # Registry DNS was unavailable at artifact creation. Do not invent a lockfile.
      # On first successful networked run review/commit package-lock.json.
      # Require npm ci exclusively before any reproducible release claim.
      - name: Install frontend dependencies (bootstrap until a reviewed lock exists)
        working-directory: apps/web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      # Runs actual tsc/build/production Next + 4 native browser tests;
      # no substitution of apps/demo, no skipping missing prerequisites.
      - run: python scripts/verify_next.py --output evals/reports/ci/next-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-next-validation-records
          path: |
            evals/reports/ci/next-gate
            apps/web/package-lock.json
