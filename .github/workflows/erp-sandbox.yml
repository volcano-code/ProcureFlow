name: isolated-real-erpnext-validation
on:
  push:
    branches: [main, 'develop/**']
    # Native request/import changes must retain the nine-scenario joint ERP gate.
    paths: ['services/api/**', 'apps/web/**', 'scripts/**', 'integrations/erpnext/**', 'compose.erp-sandbox.yaml', '.github/workflows/erp-sandbox.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-erpnext:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        business-database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: procureflow_erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d procureflow_erp_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      COMPOSE_PROJECT_NAME: pf-erp-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.business-database }}
      PF_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-disposable-only@127.0.0.1:5432/procureflow_erp_test
      PF_ALLOW_DATABASE_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Archive only tracked source at this exact commit
        run: git archive --format=zip --output="${RUNNER_TEMP}/procureflow-source.zip" "${GITHUB_SHA}"
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r services/api/requirements-dev.txt -r services/api/requirements-postgres.txt
      - name: Create new isolated credentials without printing them
        run: python scripts/init_erp_sandbox.py --create-ephemeral
      - name: Start real ERPNext with a fresh MariaDB
        run: docker compose --env-file .env.erp-sandbox -f compose.erp-sandbox.yaml up -d
      - name: Seed synthetic master data and restricted identity
        run: |
          set -o pipefail
          mkdir -p evals/reports/ci/erp-sandbox
          docker compose --env-file .env.erp-sandbox -f compose.erp-sandbox.yaml exec -T erp-backend /home/frappe/frappe-bench/env/bin/python /opt/pf-sandbox/seed.py | tee evals/reports/ci/erp-sandbox/seed.json
          mkdir -p .data
          docker compose --env-file .env.erp-sandbox -f compose.erp-sandbox.yaml cp erp-backend:/tmp/pf-erp-sandbox-credentials.json .data/erp-sandbox.json
          chmod 600 .data/erp-sandbox.json
      - name: Real TXT CSV XLSX and two-item HTTP approval and Worker execution
        id: roundtrip
        run: python scripts/verify_erp_sandbox.py --ephemeral-test --include-multi-item --business-database ${{ matrix.business-database }} --output evals/reports/ci/erp-sandbox/roundtrip.json
      - name: Prove negative REST permissions with the restricted identity
        run: python scripts/probe_erp_permissions.py --ephemeral-test --roundtrip evals/reports/ci/erp-sandbox/roundtrip.json --output evals/reports/ci/erp-sandbox/permission-probes.json
      - name: Independently query ERP database and enforce uniqueness
        if: always() && steps.roundtrip.outcome == 'success'
        run: |
          docker compose --env-file .env.erp-sandbox -f compose.erp-sandbox.yaml cp evals/reports/ci/erp-sandbox/roundtrip.json erp-backend:/tmp/pf-erp-result.json
          docker compose --env-file .env.erp-sandbox -f compose.erp-sandbox.yaml exec -T erp-backend /home/frappe/frappe-bench/env/bin/python /opt/pf-sandbox/audit.py > evals/reports/ci/erp-sandbox/database-audit.json
      - name: Record image identities
        if: always()
        run: |
          mkdir -p evals/reports/ci/erp-sandbox
          docker image inspect frappe/erpnext:v16.36.0 --format '{{json .RepoDigests}}' > evals/reports/ci/erp-sandbox/image-digests.json
      - name: Require complete ERP validation evidence
        if: always()
        run: python scripts/check_erp_sandbox_evidence.py --include-multi-item --business-database ${{ matrix.business-database }} --directory evals/reports/ci/erp-sandbox > evals/reports/ci/erp-sandbox/acceptance.json
      - name: Require select-only Account permissions in both stages
        if: always()
        run: python integrations/erpnext/sandbox/lab_permissions.py --directory evals/reports/ci/erp-sandbox > evals/reports/ci/erp-sandbox/reference-access.json
      - name: Destroy only this disposable lab
        if: always()
        run: docker compose --env-file .env.erp-sandbox -f compose.erp-sandbox.yaml down -v --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-erpnext-${{ matrix.business-database }}-validation-records
          path: evals/reports/ci/erp-sandbox
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-sandbox-${{ matrix.business-database }}-source
          path: ${{ runner.temp }}/procureflow-source.zip
          if-no-files-found: error
          retention-days: 7
