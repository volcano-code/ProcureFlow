name: import-policy-library
on:
  push:
    branches: ['develop/remediation-policy-library']
    paths: ['.github/workflows/import-policy-library.yml']
permissions:
  contents: write
jobs:
  import-reviewed-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'volcano-code/ProcureFlow' && github.ref == 'refs/heads/develop/remediation-policy-library'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.ref }}
      - name: Verify base, source bytes and exact resulting tree
        env:
          PATCH_URL: https://7a1dbdde-05a7-4e38-bda3-96b84a91c526.sandbox.floot.app/_cdn/static/802c69a3-49ec-4b7c-8a80-90ac126a5cf6-policy-library-20ecc84-0cafc994.patch
          PATCH_SHA: 0cafc994f99763b1b1b3b56f04f0641cf5b378d9821d849c7f0a299a4708a650
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 20ecc84b92634fca46a8d6cfc769f8f919d49ff4
          test -z "$(git status --porcelain)"
          curl --fail --silent --show-error --max-time 45 --max-filesize 1000000 "$PATCH_URL" -o "$RUNNER_TEMP/feature.patch"
          echo "$PATCH_SHA  $RUNNER_TEMP/feature.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/feature.patch"
          git apply --index "$RUNNER_TEMP/feature.patch"
          test -z "$(git diff --cached --name-only -- .github)"
          cp .git/index "$RUNNER_TEMP/verify.index"
          GIT_INDEX_FILE="$RUNNER_TEMP/verify.index" git update-index --force-remove .github/workflows/import-policy-library.yml
          test "$(GIT_INDEX_FILE="$RUNNER_TEMP/verify.index" git write-tree)" = fc29415c710a9114cead2a75b5f20410d7fa9a77
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: versioned advisory reference documents, authenticated search and local neural retrieval'
          git push origin HEAD:develop/remediation-policy-library
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/import-identity.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: policy-library-import-identity
          path: ${{ runner.temp }}/import-identity.txt
          if-no-files-found: error
