name: import-reference-advice
on:
  push:
    branches: ['develop/remediation-reference-advice']
permissions:
  contents: write
jobs:
  import-verified-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/develop/remediation-reference-advice'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check fixed base, patch digest and resulting source tree
        env:
          PATCH_URL: https://7a1dbdde-05a7-4e38-bda3-96b84a91c526.sandbox.floot.app/_cdn/static/2928ac70-c218-48b8-bcfe-e8afa95189b7-reference-advice-d36d520-9b7bc2ff.patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d36d52019b9947f7bb3f7f987333ec0352230e80
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/import-reference-advice.yml
          curl --fail --silent --show-error --proto '=https' --max-time 40 "$PATCH_URL" -o "$RUNNER_TEMP/reference-advice.patch"
          echo "9b7bc2ff50b5930394516142a1f4f24916d3dd5c8fc29d483e37d41dec0bcac9  $RUNNER_TEMP/reference-advice.patch" | sha256sum -c -
          git rm .github/workflows/import-reference-advice.yml
          git apply --check "$RUNNER_TEMP/reference-advice.patch"
          git apply --index "$RUNNER_TEMP/reference-advice.patch"
          test "$(git write-tree)" = 444f729e0310c348129022968e8aa27877cc651d
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: bind advisory references into agent tools, MCP and native citation readback'
          git push origin HEAD:refs/heads/develop/remediation-reference-advice
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/reference-import-identity.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: reference-advice-import-identity
          path: ${{ runner.temp }}/reference-import-identity.txt
          if-no-files-found: error
