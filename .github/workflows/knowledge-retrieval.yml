name: versioned-policy-document-retrieval
on:
  pull_request:
    paths: ['services/api/**', 'apps/web/**', 'integrations/mcp/**', 'tests/test_knowledge*', 'evals/knowledge/**', 'scripts/evaluate_knowledge.py', '.github/workflows/knowledge-retrieval.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documents-and-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r services/api/requirements-dev.txt -r services/api/requirements-mcp.txt
      - run: python -m pip check
      - name: Real service, migration and official SDK protocol
        run: python -m pytest -q tests/test_knowledge.py tests/test_knowledge_migration.py tests/test_mcp_bridge.py integrations/mcp/tests --junitxml=${{ runner.temp }}/knowledge/protocol.xml
      - name: Full application endpoints, advice and graph regressions
        run: python scripts/test.py -q tests/test_knowledge_http.py tests/test_migrations.py tests/test_advice_runs.py tests/test_graph_runtime.py --junitxml=${{ runner.temp }}/knowledge/application.xml
      - name: Canonical API contract drift
        run: python scripts/export_contracts.py --check
      - name: Actual development retrieval results, not model quality
        run: python scripts/evaluate_knowledge.py --output ${{ runner.temp }}/knowledge/retrieval.json
      - run: npm run test:unit --prefix apps/web
      - name: Exact source identity
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/knowledge"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/knowledge/source-identity.txt"
          git archive --format=zip --prefix=procureflow/ HEAD -o "$RUNNER_TEMP/knowledge-source.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: knowledge-retrieval-evidence, path: '${{ runner.temp }}/knowledge', if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: knowledge-retrieval-source, path: '${{ runner.temp }}/knowledge-source.zip', if-no-files-found: error}
  postgres-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: ci-disposable-only, POSTGRES_DB: knowledge_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PF_TEST_BACKEND: postgresql
      PF_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-disposable-only@127.0.0.1:5432/knowledge_test
      PF_ALLOW_DATABASE_TESTS: '1'
      PF_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r services/api/requirements-dev.txt -r services/api/requirements-postgres.txt
      - run: python scripts/test.py -q tests/test_knowledge_http.py --junitxml=${{ runner.temp }}/knowledge-pg.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: knowledge-postgres-evidence, path: '${{ runner.temp }}/knowledge-pg.xml', if-no-files-found: error}
