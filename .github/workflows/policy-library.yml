name: policy-reference-library
on:
  pull_request:
    paths: ['services/api/**', 'apps/web/**', 'scripts/**', 'tests/**', 'integrations/policy_search/**', 'evals/policy_search/**', '.github/workflows/policy-library.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: procureflow_reference_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d procureflow_reference_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r services/api/requirements-dev.txt -r services/api/requirements-postgres.txt
      - name: Reference, migration and complete parent HTTP tests
        run: python -m pytest -q tests/test_policy_library.py tests/test_policy_library_migration.py integrations/policy_search/tests --junitxml=evals/reports/ci/reference/service.xml
      - name: PostgreSQL reference service and source integrity
        env:
          PF_TEST_DATABASE_URL: postgresql+psycopg://postgres:disposable-test-only@127.0.0.1:5432/procureflow_reference_test
          PF_ALLOW_DATABASE_TESTS: '1'
          PF_TEST_BACKEND: postgresql
        run: python scripts/test.py -q tests/test_policy_library_pg.py --junitxml=../../evals/reports/ci/reference/postgres.xml
      - name: Rule and backup regressions plus unchanged core contracts
        run: |
          python scripts/test.py -q tests/test_migrations.py tests/test_candidate_dispatch_migration.py tests/test_policy_versions.py tests/test_backup_recovery.py --junitxml=../../evals/reports/ci/reference/regression.xml
          python scripts/export_contracts.py --check
          python scripts/export_policy_contract.py --check
      - run: python scripts/evaluate_policy_search.py --output evals/reports/ci/reference/lexical-dev20.json
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --prefix apps/web
      - name: Native reference library user flow
        run: python scripts/verify_next.py --reference-library --output evals/reports/ci/reference/browser
      - name: Record source identity
        if: always()
        run: |
          mkdir -p evals/reports/ci/reference
          git rev-parse HEAD HEAD^{tree} > evals/reports/ci/reference/source-identity.txt
          git diff --exit-code -- apps/web/package-lock.json apps/web/tsconfig.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-library-engineering
          path: evals/reports/ci/reference
          if-no-files-found: error
  local-learned-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r services/api/requirements-dev.txt -r services/api/requirements-retrieval.txt
      - name: Explicit pinned public model download, no model API key
        run: python scripts/prepare_policy_model.py --allow-public-download --output "$RUNNER_TEMP/bge-policy-model"
      - name: Actual local neural inference with Hub access disabled
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python scripts/evaluate_policy_search.py --model-dir "$RUNNER_TEMP/bge-policy-model" --output evals/reports/ci/reference-neural/dev20.json
      - name: Record source and dependency versions
        if: always()
        run: |
          mkdir -p evals/reports/ci/reference-neural
          git rev-parse HEAD HEAD^{tree} > evals/reports/ci/reference-neural/source-identity.txt
          python -m pip list --format=json > evals/reports/ci/reference-neural/dependencies.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-library-local-neural
          path: evals/reports/ci/reference-neural
          if-no-files-found: error
