name: remediation-dependencies
on:
  push:
    branches: ['develop/remediation-r1-batch2']
    paths: ['.github/workflows/remediation-dependencies.yml']
permissions:
  contents: read
jobs:
  runtime-wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: |
          python -m pip download --only-binary=:all: -r services/api/requirements.txt -r services/api/requirements-postgres.txt -d "${RUNNER_TEMP}/runtime-wheels"
      - name: Record digests
        run: cd "${RUNNER_TEMP}/runtime-wheels" && sha256sum *.whl > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: remediation-runtime-wheels
          path: ${{ runner.temp }}/runtime-wheels
          if-no-files-found: error
          retention-days: 7
