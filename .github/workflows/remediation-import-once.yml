name: remediation-import-once
on:
  push:
    branches: ['develop/remediation-r1-batch2']
    paths: ['.github/workflows/remediation-import-once.yml']
permissions:
  contents: write
jobs:
  import-reviewed-code:
    if: github.repository == 'volcano-code/ProcureFlow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/remediation-r1-batch2
          fetch-depth: 2
      - name: Reject changed branch or wrong parent
        env:
          EXPECTED_EVENT: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_EVENT"
          test "$(git rev-parse HEAD^)" = c70fe5ea239e505101e343dc12231b65d1c22920
      - name: Download fixed generated code patch and verify before applying
        run: |
          curl --fail --silent --show-error --max-time 60 --max-filesize 250000 'https://7a1dbdde-05a7-4e38-bda3-96b84a91c526.sandbox.floot.app/_cdn/static/8dcebd7d-0c4b-495b-b5e6-5fff8c5481a2-ProcureFlow-batch2-8097c3d.patch' -o "$RUNNER_TEMP/remediation.patch"
          echo "8097c3d30d9c1d199ed231c711473e7b0d321fdfb68a3f21ae7c219ec5602b8a  $RUNNER_TEMP/remediation.patch" | sha256sum -c -
          git apply --check --index --exclude='.github/workflows/*' "$RUNNER_TEMP/remediation.patch"
          git apply --index --exclude='.github/workflows/*' "$RUNNER_TEMP/remediation.patch"
      - name: Verify entire non-workflow tree matches tested local source
        run: |
          cp .git/index "$RUNNER_TEMP/verify-index"
          GIT_INDEX_FILE="$RUNNER_TEMP/verify-index" git ls-files -z '.github/workflows' | GIT_INDEX_FILE="$RUNNER_TEMP/verify-index" git update-index --force-remove -z --stdin
          test "$(GIT_INDEX_FILE="$RUNNER_TEMP/verify-index" git write-tree)" = 5378f62c6bf2360e5e975c54d46fe5bc82774008
          git diff --cached --check
      - name: Commit code only and fast-forward only this branch
        run: |
          git config user.name 'ProcureFlow development'
          git config user.email 'procureflow-dev@example.invalid'
          git commit -m 'feat: evidence-bound quotation candidates and human-review workbench'
          git push origin HEAD:refs/heads/develop/remediation-r1-batch2
          git rev-parse HEAD HEAD^{tree}
