# Overlay: docker compose --env-file .env.postgres -f compose.postgres.yaml -f compose.web.yaml up --build -d --wait
# Local demo only. Existing backend/DB stack is required; this is not a standalone file.
services:
  web:
    image: procureflow-web:local
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    ports:
      - '127.0.0.1:${PF_WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/backend/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
